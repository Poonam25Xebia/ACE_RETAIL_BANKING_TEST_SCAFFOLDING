# Local infrastructure for SCAFFOLD-SVC-001. Only PostgreSQL is required to start the service;
# MongoDB, Redis and Kafka are wired but unused and can be started on demand with --profile optional.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-account_management}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30

  mongodb:
    image: mongo:7
    profiles: ["optional"]
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    profiles: ["optional"]
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.8.0
    profiles: ["optional"]
    ports:
      - "9092:9092"
